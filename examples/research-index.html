<body><main><h1>六组研究能力</h1><p>jsPsych 7.3.4 · 独立运行。默认使用模拟模型，真实调用在地址末尾添加 &amp;live=1，并启动已配置代理的本地服务器。</p><p><a href="builder.html">打开独立配置器</a> · <a href="index.html">九类基础插件示例</a></p><ul id="examples"></ul><p>语音完整示例需要点击收音按钮。模拟语音用于检查流程，真实转录与播报使用独立语音代理。</p></main>
